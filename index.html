<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Portal — Calls by Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0c0f14; --surface:#151a22; --surface-2:#1b212b; --raise:#222a35;
  --border:rgba(255,255,255,0.08); --border-2:rgba(255,255,255,0.14);
  --text:#e8eaed; --text-2:#a7adb8; --muted:#6f7681;
  --accent:#e9a23b; --accent-dim:rgba(233,162,59,0.14);
  --up:#3fc78a; --down:#f06a6a; --up-bg:rgba(63,199,138,0.12); --down-bg:rgba(240,106,106,0.12);
  --mono:'Roboto Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 620px at 82% -8%, rgba(233,162,59,0.07), transparent 60%),
    radial-gradient(900px 520px at -6% 4%, rgba(57,135,229,0.06), transparent 55%),
    var(--page);
  color:var(--text); font-family:'Manrope',system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.45; min-height:100vh;
}
.app{display:flex; min-height:100vh}
.side{width:200px; flex:0 0 200px; border-right:1px solid var(--border); padding:22px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px}
.brand{font-family:'Fraunces',serif; font-size:19px; font-weight:600; padding:0 8px 2px; line-height:1.2}
.brand small{display:block; font-family:'Manrope'; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-top:5px}
.nav{margin-top:16px; display:flex; flex-direction:column; gap:2px}
.nav-item{display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:9px; cursor:pointer; color:var(--text-2); font-weight:600; font-size:13.5px; user-select:none}
.nav-item:hover{background:var(--surface); color:var(--text)}
.nav-item.active{background:var(--accent-dim); color:var(--accent)}
.nav-item .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.side-foot{margin-top:auto; font-size:10.5px; color:var(--muted); padding:8px; line-height:1.5}
.main{flex:1; min-width:0; padding:22px 26px 60px}
.topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px}
.topbar h1{font-family:'Fraunces',serif; font-weight:600; font-size:23px; margin:0}
.topbar .sub{color:var(--muted); font-size:12px; margin-top:3px}
.tb-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.btn{background:var(--surface); border:1px solid var(--border-2); color:var(--text); padding:7px 13px; border-radius:8px; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.gold{background:var(--accent); color:#1a1204; border-color:transparent}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px; font-size:12px}
.grid{display:grid; gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin-bottom:16px}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 15px}
.tile .k{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}
.tile .v{font-size:23px; font-weight:600; margin-top:5px; font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px; color:var(--text-2); font-weight:500}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:16px}
.panel h2{font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin:0 0 3px}
.panel .desc{color:var(--muted); font-size:12px; margin-bottom:12px}
.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; margin-bottom:14px; flex-wrap:wrap}
.seg button{background:transparent; border:0; color:var(--text-2); font:inherit; font-weight:600; font-size:13px; padding:6px 14px; border-radius:7px; cursor:pointer}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent); color:#1a1204}
.seg.small button{font-size:12px; padding:5px 12px}
.tw{overflow-x:auto; border-radius:10px}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{padding:7px 9px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
input[type=number].cell::-webkit-outer-spin-button,input[type=number].cell::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number].cell{-moz-appearance:textfield}
input[type=date].cell{min-width:104px}
th{color:var(--muted); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:700}
tbody tr:hover{background:rgba(255,255,255,0.025)}
td.num,th.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.name{font-weight:600}
.tk{color:var(--muted); font-size:11px; font-family:var(--mono); margin-left:6px}
.link{cursor:pointer; border-bottom:1px dashed rgba(255,255,255,0.2)}
.link:hover{color:var(--accent); border-color:var(--accent)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--text-2)}
.grp-head td{background:var(--surface-2); color:var(--text-2); font-size:11px; letter-spacing:.05em; text-transform:uppercase; font-weight:700; text-align:left; padding-top:9px; padding-bottom:9px}
.grp-head .cnt{color:var(--muted); font-weight:600}
.subtotal td{border-top:1px solid var(--border-2); font-weight:700; color:var(--text-2); background:rgba(255,255,255,0.02)}
input.cell, select.cell{background:var(--surface-2); border:1px solid transparent; color:var(--text); font:inherit; font-size:12.5px; padding:4px 7px; border-radius:6px; width:100%; min-width:56px; font-variant-numeric:tabular-nums}
input.cell{text-align:right; font-family:var(--mono)}
td:first-child input.cell{text-align:left; font-family:'Manrope'}
input.cell:focus, select.cell:focus{outline:none; border-color:var(--accent); background:var(--raise)}
input.cell::placeholder{color:var(--muted)}
select.cell{cursor:pointer; -webkit-appearance:none; appearance:none}
.w-name{min-width:150px} .w-tk{min-width:96px} .w-sm{width:92px} .w-dt{width:110px} .w-xs{width:74px}
.pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700}
.pill.buy{background:var(--up-bg); color:var(--up)} .pill.sell{background:var(--down-bg); color:var(--down)} .pill.hold{background:rgba(167,173,184,.14); color:var(--text-2)}
.badge{display:inline-block; padding:2px 8px; border-radius:6px; font-size:10.5px; font-weight:700}
.badge.hit{background:var(--up-bg); color:var(--up)} .badge.miss{background:var(--down-bg); color:var(--down)} .badge.na{background:rgba(167,173,184,.12); color:var(--muted)}
.del{cursor:pointer; color:var(--muted); font-weight:700; padding:2px 6px; border-radius:6px}
.del:hover{color:var(--down); background:var(--down-bg)}
.addbar{display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap}
.small{font-size:11px;color:var(--muted)}
.tag{font-size:10px; color:var(--muted); background:var(--surface-2); border:1px solid var(--border); padding:1px 6px; border-radius:5px; font-family:var(--mono)}
.star{cursor:pointer; user-select:none; font-size:14px; line-height:1; color:var(--muted); flex:0 0 auto}
.star:hover, .star.on{color:var(--accent)}
.viewonly .star{cursor:default; pointer-events:none}
.viewonly .star:not(.on){display:none}
.chartbox{position:relative; height:260px}
.modal{position:fixed; inset:0; background:rgba(4,6,10,.7); display:flex; align-items:center; justify-content:center; z-index:60; padding:20px}
.modal .box{background:var(--surface); border:1px solid var(--border-2); border-radius:14px; padding:18px; width:min(720px,95vw); max-height:90vh; overflow:auto}
.modal h3{font-family:'Fraunces',serif; margin:0 0 4px; font-size:17px}
.modal .x{float:right; cursor:pointer; color:var(--muted); font-size:22px; line-height:1}
.field{margin:12px 0}
.field label{display:block; font-size:12px; color:var(--text-2); font-weight:600; margin-bottom:4px}
.field input{width:100%; background:var(--surface-2); border:1px solid var(--border-2); color:var(--text); padding:8px 10px; border-radius:8px; font:inherit; font-size:13px}
.note{background:var(--accent-dim); border:1px solid rgba(233,162,59,.3); color:#f0c98a; padding:8px 12px; border-radius:9px; font-size:12px; margin:10px 0}
.hidden{display:none!important}
.aname{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.aname i{width:10px;height:10px;border-radius:3px;display:inline-block}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border-2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body data-palette="#3987e5,#199e70,#c98500,#008300,#9085e9,#e66767,#d55181,#d95926">
<div class="app">
  <aside class="side">
    <div class="brand">Research Portal<small>Calls by analyst</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="foot">loading…</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h1 id="viewTitle">Analysts</h1><div class="sub" id="viewSub"></div></div>
      <div class="tb-actions">
        <span id="sync" class="small"></span>
      </div>

    <div id="views"></div>

<script>
"use strict";
/* ---------- ticker-suffix → benchmark / country / currency (mirrors scripts/*.py) ---------- */
const SUFFIX_BENCH={".HK":"^HSI",".SS":"000300.SS",".SZ":"000300.SS",".NS":"^CRSLDX",".BO":"^CRSLDX",".TW":"^TWII",".TWO":"^TWII",".KS":"^KS11",".KQ":"^KS11",".SI":"^STI",".KL":"^KLSE",".BK":"^SET.BK",".JK":"^JKSE",".PS":"PSEI.PS",".T":"^N225",".L":"^FTSE",".AX":"^AXJO",".TO":"^GSPTSE",".DE":"^GDAXI",".PA":"^FCHI"};
const SUFFIX_COUNTRY={".HK":"HK",".SS":"CN",".SZ":"CN",".NS":"IN",".BO":"IN",".TW":"TW",".TWO":"TW",".KS":"KR",".KQ":"KR",".SI":"ASEAN",".KL":"ASEAN",".BK":"ASEAN",".JK":"ASEAN",".PS":"ASEAN",".T":"JP",".L":"UK",".AX":"AU",".TO":"CA",".DE":"EU",".PA":"EU"};
const SUFFIX_CCY={".HK":"HKD",".SS":"CNY",".SZ":"CNY",".NS":"INR",".BO":"INR",".TW":"TWD",".TWO":"TWD",".KS":"KRW",".KQ":"KRW",".SI":"SGD",".KL":"MYR",".BK":"THB",".JK":"IDR",".PS":"PHP",".T":"JPY",".L":"GBP",".AX":"AUD",".TO":"CAD",".DE":"EUR",".PA":"EUR"};
const BENCH_NAME={"^HSI":"Hang Seng","000300.SS":"CSI 300","^CRSLDX":"Nifty 500","^BSESN":"Sensex","^TWII":"TAIEX","^KS11":"KOSPI","^STI":"STI","^KLSE":"KLCI","^SET.BK":"SET","^JKSE":"JKSE","PSEI.PS":"PSEi","^N225":"Nikkei","^GSPC":"S&P 500","^FTSE":"FTSE 100","^AXJO":"ASX 200","^GSPTSE":"TSX","^GDAXI":"DAX","^FCHI":"CAC 40"};
const CUR_SYM={INR:"₹",TWD:"NT$",KRW:"₩",USD:"$",HKD:"HK$",JPY:"¥",CNY:"¥",SGD:"S$",MYR:"RM",THB:"฿",IDR:"Rp",PHP:"₱",GBP:"£",EUR:"€",AUD:"A$",CAD:"C$"};
const COUNTRIES=[["HK","Hong Kong"],["CN","China"],["IN","India"],["TW","Taiwan"],["KR","Korea"],["ASEAN","ASEAN"],["AU","Australia"]];
// Holdings = the MAEI · Maybank Asiapac ex-Japan Equity-I fund (31/07/2026). {name,ticker[,country]} —
// country/currency & 1D/1W/1M/YTD all derive from the ticker; `country` is only for the pending-ticker rows.
const FUND_HOLDINGS=[
  {name:"Alibaba Group Holding",ticker:"9988.HK"},
  {name:"CATL (Contemporary Amperex) H",ticker:"3750.HK"},
  {name:"PetroChina",ticker:"0857.HK"},
  {name:"WuXi AppTec",ticker:"2359.HK"},
  {name:"Precision Tsugami China",ticker:"1651.HK"},
  {name:"Sany Heavy Equipment Intl",ticker:"0631.HK"},
  {name:"Weichai Power",ticker:"2338.HK"},
  {name:"China Hongqiao Group",ticker:"1378.HK"},
  {name:"CMOC Group",ticker:"3993.HK"},
  {name:"Zijin Gold International",ticker:"2259.HK"},
  {name:"Eastroc Beverage (H)",ticker:"9980.HK"},
  {name:"Chaozhou Three-Circle (H)",ticker:"6951.HK"},
  {name:"CATL (Contemporary Amperex) A",ticker:"300750.SZ"},
  {name:"Advanced Micro-Fabrication",ticker:"688012.SS"},
  {name:"Naura Technology Group",ticker:"002371.SZ"},
  {name:"Zhongji Innolight",ticker:"300308.SZ"},
  {name:"Bharti Airtel",ticker:"BHARTIARTL.NS"},
  {name:"TVS Motor",ticker:"TVSMOTOR.NS"},
  {name:"Reliance Industries",ticker:"RELIANCE.NS"},
  {name:"Apollo Hospitals",ticker:"APOLLOHOSP.NS"},
  {name:"Emcure Pharmaceuticals",ticker:"EMCURE.NS"},
  {name:"Sai Life Sciences",ticker:"SAILIFE.NS"},
  {name:"Sun Pharmaceutical",ticker:"SUNPHARMA.NS"},
  {name:"Torrent Pharmaceuticals",ticker:"TORNTPHARM.NS"},
  {name:"Adani Ports & SEZ",ticker:"ADANIPORTS.NS"},
  {name:"GE Vernova T&D India",ticker:"GVT&D.NS"},
  {name:"KEI Industries",ticker:"KEI.NS"},
  {name:"Syrma SGS Technology",ticker:"SYRMA.NS"},
  {name:"Hyosung Heavy Industries",ticker:"298040.KS"},
  {name:"Amorepacific",ticker:"090430.KS"},
  {name:"APR Corp",ticker:"278470.KS"},
  {name:"Samyang Foods",ticker:"003230.KS"},
  {name:"HD Korea Shipbuilding & Offshore",ticker:"009540.KS"},
  {name:"Samsung C&T",ticker:"028260.KS"},
  {name:"Samsung Heavy Industries",ticker:"010140.KS"},
  {name:"Samsung Electro-Mechanics",ticker:"009150.KS"},
  {name:"Samsung Electronics",ticker:"005930.KS"},
  {name:"Samsung Electronics (Pref)",ticker:"005935.KS"},
  {name:"SK Hynix",ticker:"000660.KS"},
  {name:"Elite Material",ticker:"2383.TW"},
  {name:"King Yuan Electronics",ticker:"2449.TW"},
  {name:"TSMC",ticker:"2330.TW"},
  {name:"E Ink Holdings",ticker:"8069.TWO"},
  {name:"Accton Technology",ticker:"2345.TW"},
  {name:"ASE Technology Holding",ticker:"3711.TW"},
  {name:"Bizlink Holding",ticker:"3665.TW"},
  {name:"Delta Electronics",ticker:"2308.TW"},
  {name:"Gold Circuit Electronics",ticker:"2368.TW"},
  {name:"MediaTek",ticker:"2454.TW"},
  {name:"Wiwynn",ticker:"6669.TW"},
  {name:"Singapore Telecommunications",ticker:"Z74.SI"},
  {name:"Yangzijiang Shipbuilding",ticker:"BS6.SI"},
  {name:"Soilbuild Construction Group",ticker:"ZQM.SI"},
  {name:"Cahaya Aero Services",ticker:"CASS.JK"},
  {name:"BHP Group",ticker:"BHP.AX"},
  {name:"Rio Tinto",ticker:"RIO.AX"},
];
const holdCountry=t=>t.ticker?countryFromTicker(t.ticker):(t.country||"US");
const WORKER=(location.hostname==="localhost"||location.hostname==="127.0.0.1")?"http://127.0.0.1:8787":"https://mamreg-api.mamreg.workers.dev";
const LS_BOOK="grp-book-v3", LS_TOKEN="grp-write-token", LS_PRICES="grp-prices-v1";
const TABS=[["analysts","Analysts"],["holdings","Holdings"]];
const ANALYST_COLORS=["#3987e5","#199e70","#c98500","#9085e9","#e66767","#d55181"];

const sfx=t=>{const i=(t||"").lastIndexOf(".");return i>0?t.slice(i):"";};
const benchFromTicker=t=>SUFFIX_BENCH[sfx(t)]||"^GSPC";
const countryFromTicker=t=>SUFFIX_COUNTRY[sfx(t)]||"US";
const ccyFromTicker=t=>SUFFIX_CCY[sfx(t)]||"USD";

let BOOK=null, PRICES={quotes:{},closes:{},fx:{},generated:null}, SEED=null;
let SORTED={};
let view="analysts", selAnalyst=null, section="calls", tileScope="auto";
let charts={};
let ROLE={role:null, analyst:null};   // admin | editor(+analyst) | viewer
function canEdit(id){ return ROLE.role==="admin" || (ROLE.role==="editor" && ROLE.analyst===id); }
function canEditHoldings(){ return ROLE.role==="admin"; }
function canAddAnalyst(){ return ROLE.role==="admin"; }

/* ---------- load / save (book in Cloudflare KV via the Worker) ---------- */
/* ---------- auth / one shared site password ---------- */
function authHeaders(){ return {authorization:"Bearer "+(localStorage.getItem(LS_TOKEN)||"")}; }
function getBook(){ return fetch(`${WORKER}/book`,{headers:authHeaders()}); }
async function fetchRole(){   // → {role,analyst} | {role:"none"} | null(network)
  try{ const r=await fetch(`${WORKER}/me`,{headers:authHeaders()});
    if(r.status===404) return {role:"admin",analyst:null};   // legacy Worker (pre-roles) → behave as before
    if(r.ok) return await r.json();
    if(r.status===401) return {role:"none",analyst:null};
  }catch(e){}
  return null;
}
function boot(){
  const qs=new URLSearchParams(location.search);
  if(qs.get("token")) localStorage.setItem(LS_TOKEN, qs.get("token"));   // dev convenience
  if(localStorage.getItem(LS_TOKEN)) load(); else showGate();
}
function showGate(msg){
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="modal" style="background:var(--page)"><div class="box" style="width:min(360px,92vw);text-align:center">
    <div class="brand" style="font-size:23px">Research Portal</div>
    <div class="small" style="margin:8px 0 16px">Enter the shared password to continue.</div>
    <input id="gatePw" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);padding:10px 12px;border-radius:9px;font-size:14px">
    <div id="gateErr" class="down" style="font-size:12px;height:16px;margin-top:8px">${esc(msg||"")}</div>
    <button class="btn gold" id="gateGo" style="width:100%;margin-top:8px">Enter</button></div></div>`;
  const inp=document.getElementById("gatePw"); inp.focus();
  const go=async()=>{
    const pw=inp.value.trim(); if(!pw)return;
    document.getElementById("gateErr").textContent="";
    localStorage.setItem(LS_TOKEN,pw);
    const role=await fetchRole();
    if(role&&role.role&&role.role!=="none"){ ROLE=role; root.innerHTML=""; load(); }
    else if(role&&role.role==="none"){ localStorage.removeItem(LS_TOKEN); document.getElementById("gateErr").textContent="Incorrect password."; }
    else { document.getElementById("gateErr").textContent="Can't reach the server — try again."; }
  };
  document.getElementById("gateGo").onclick=go;
  inp.onkeydown=e=>{ if(e.key==="Enter") go(); };
}
async function load(){
  const qs=new URLSearchParams(location.search);
  if(!ROLE.role){ const role=await fetchRole(); if(!role||role.role==="none"){ localStorage.removeItem(LS_TOKEN); showGate("Enter the password to continue."); return; } ROLE=role; }
  try{ SEED=await fetch("data/book.json").then(r=>r.json()); }catch(e){ SEED={analysts:[],holdings:[],calls:[]}; }
  let book=null;
  try{ const r=await getBook();
    if(r.status===401){ localStorage.removeItem(LS_TOKEN); showGate("Incorrect password."); return; }
    if(r.ok){ const b=await r.json(); if(b&&(b.calls||b.holdings||b.analysts)) book=b; }
  }catch(e){}
  if(!book){ const ls=localStorage.getItem(LS_BOOK); if(ls){ try{book=JSON.parse(ls);}catch(e){} } }
  BOOK=book?book:structuredClone(SEED);
  if(!BOOK.holdings)BOOK.holdings=[]; if(!BOOK.calls)BOOK.calls=[]; if(!BOOK.analysts)BOOK.analysts=[]; if(!BOOK.coverage)BOOK.coverage=[];
  // migrate LEGACY coverage rows (a flat `rating` and no history) → one dated stance.
  // New rows start with an empty history — no "today N" filler — so the first call sets the entry.
  { const _td=new Date().toISOString().slice(0,10);
    BOOK.coverage.forEach(o=>{ if((!Array.isArray(o.history)||!o.history.length)&&o.rating){ o.history=[{id:"hx-"+Math.random().toString(36).slice(2,8),date:_td,rating:RATING_MIGRATE[o.rating]||"N"}]; } if(!Array.isArray(o.history))o.history=[]; delete o.rating; }); }
  lastSynced=structuredClone(BOOK);
  // one-off: normalise Ziv's analyst — id "ang" → "ziv" (+ name, + re-point its calls/coverage rows)
  { const a=(BOOK.analysts||[]).find(x=>x.id==="ang"||x.name==="Ang");
    if(a){ a.name="Ziv"; if(a.id==="ang"){ a.id="ziv";
      ["calls","coverage"].forEach(k=>(BOOK[k]||[]).forEach(r=>{ if(r.analyst==="ang") r.analyst="ziv"; }));
      if(selAnalyst==="ang") selAnalyst="ziv"; }
      save(); } }
  // one-off: migrate legacy Alpha calls (flat trade rows) → per-name locked call log (history[] of dated Buy/Sell/Hold)
  if((BOOK.calls||[]).some(c=>!Array.isArray(c.history))){
    const groups=new Map();   // "analyst|ticker" → merged name-record; each old call becomes a dated call in its history
    (BOOK.calls||[]).forEach(c=>{
      if(Array.isArray(c.history)){ groups.set("id|"+c.id, c); return; }   // already migrated — keep as-is
      const key=c.analyst+"|"+(c.ticker||"");
      let rec=groups.get(key);
      if(!rec){ rec={id:c.id,analyst:c.analyst,ticker:c.ticker||"",name:c.name||"",rationale:c.rationale||"",history:[]}; groups.set(key,rec); }
      rec.history.push({id:"hx-"+Math.random().toString(36).slice(2,8),date:c.entryDate||"",call:c.call||"Hold",_exit:c.exitDate||null});
      if(c.name) rec.name=c.name; if(c.rationale) rec.rationale=c.rationale;
    });
    BOOK.calls=[...groups.values()].map(rec=>{
      if(!Array.isArray(rec.history)) return rec;
      rec.history.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
      const lastExit=rec.history.length?rec.history[rec.history.length-1]._exit:null;   // stance is continuous until the next call; only the latest exit closes the name
      if(lastExit) rec.closeDate=lastExit;

    });

  }
  loadCachedPrices();

  if(selAnalyst&&!BOOK.analysts.some(a=>a.id===selAnalyst)) selAnalyst=null;

  const lb=document.getElementById("lockBtn"); if(lb) lb.onclick=e=>{e.preventDefault(); if(_poll)clearInterval(_poll); localStorage.removeItem(LS_TOKEN); showGate("Locked. Enter the password to continue.");};
  await priceAll(); render();

  if(qs.has("pdftest")) setTimeout(()=>reviewHoldings(parseHoldingsText(SAMPLE_STMT),"self-test sample"),300);
  if(qs.get("ddtest")) setTimeout(async()=>{ addCall(); const inp=document.querySelector('input.cell[data-f="ticker"]'); if(inp){ inp.focus(); inp.value=qs.get("ddtest"); await runSearch(inp,qs.get("ddtest")); } },500);
}
let _saveTimer=null, lastSynced=null, _dirty=false, _poll=null;

function mergeBook(latest, mine, base){
  const empty={analysts:[],holdings:[],calls:[]};
  latest=(latest&&(latest.calls||latest.holdings||latest.analysts))?latest:empty; base=base||empty;
  const out={...mine};
  ["analysts","holdings","calls"].forEach(coll=>{
    const byId=new Map((latest[coll]||[]).map(r=>[r.id,r]));
    const baseById=new Map((base[coll]||[]).map(r=>[r.id,r]));
    const mineIds=new Set((mine[coll]||[]).map(r=>r.id));
    (mine[coll]||[]).forEach(r=>{ const b=baseById.get(r.id); if(!b||JSON.stringify(b)!==JSON.stringify(r)) byId.set(r.id,r); });
    (base[coll]||[]).forEach(r=>{ if(!mineIds.has(r.id)) byId.delete(r.id); });
    out[coll]=[...byId.values()];
  });
  // keep analyst tabs in the client's order (so the id rename doesn't shuffle the tabs)
  if(mine.analysts&&out.analysts){ const rank=new Map(mine.analysts.map((a,i)=>[a.id,i])); out.analysts.sort((x,y)=>(rank.has(x.id)?rank.get(x.id):1e9)-(rank.has(y.id)?rank.get(y.id):1e9)); }
  return out;
}

/* ---------- live pricing via the Worker (same PRICES shape as before) ---------- */
function chartToData(js){
  const res=js&&js.chart&&js.chart.result&&js.chart.result[0]; if(!res) return null;
  const meta=res.meta||{}, ts=res.timestamp||[], ind=res.indicators||{};
  const adj=(ind.adjclose&&ind.adjclose[0]&&ind.adjclose[0].adjclose)||null;
  const raw=(ind.quote&&ind.quote[0]&&ind.quote[0].close)||null;
  const series=adj||raw||[]; const gmt=meta.gmtoffset||0; const closes={};
  for(let i=0;i<ts.length;i++){ const v=series[i]; if(v==null)continue; const d=new Date((ts[i]+gmt)*1000).toISOString().slice(0,10); closes[d]=+(+v).toFixed(4); }
  const dates=Object.keys(closes).sort(); if(!dates.length) return {closes:{},quote:null};
  const last=closes[dates[dates.length-1]];
  const price=meta.regularMarketPrice!=null?meta.regularMarketPrice:last;
  const prev=dates.length>1?closes[dates[dates.length-2]]:null;
  const now=new Date(); const ago=d=>{const x=new Date(now);x.setDate(x.getDate()-d);return x.toISOString().slice(0,10);};
  const back=dates.slice(0,-1);
  const oobL=t=>{let lo=0,hi=back.length-1,r=null;while(lo<=hi){const m=(lo+hi)>>1;if(back[m]<=t){r=m;lo=m+1;}else hi=m-1;}return r===null?null:closes[back[r]];};
  const pct=(a,b)=>(a==null||!b)?null:+(((a/b-1)*100).toFixed(2));
  const quote={price:+(+price).toFixed(4),prevClose:prev,currency:meta.currency,name:meta.longName||meta.shortName||null,
    d1:pct(last,prev),w1:pct(last,oobL(ago(7))),m1:pct(last,oobL(ago(30))),ytd:pct(last,oobL((now.getFullYear()-1)+"-12-31")),asof:dates[dates.length-1]};
  return {closes,quote};
}
async function fetchChart(sym){
  if(!sym||PRICES.closes[sym]) return;
  try{ const r=await fetch(`${WORKER}/chart?symbol=${encodeURIComponent(sym)}&range=2y`); if(!r.ok)return;
    const d=chartToData(await r.json()); if(d && Object.keys(d.closes).length){ PRICES.closes[sym]=d.closes; if(d.quote)PRICES.quotes[sym]=d.quote; SORTED[sym]=Object.keys(d.closes).sort(); }
  }catch(e){}
}
function neededSymbols(){ const s=new Set();
  [...(BOOK.holdings||[]),...(BOOK.calls||[]),...(BOOK.coverage||[]),...FUND_HOLDINGS].forEach(o=>{ if(o.ticker){ s.add(o.ticker); s.add(benchFromTicker(o.ticker)); } });
  return [...s].filter(x=>x&&!PRICES.closes[x]); }
async function priceAll(){ const list=neededSymbols(); const C=6;
  for(let i=0;i<list.length;i+=C){ await Promise.all(list.slice(i,i+C).map(fetchChart)); } cachePrices(); }
const _triedResolve=new Set();
async function ensurePriced(ticker){
  if(!ticker) return;
  const need=[ticker,benchFromTicker(ticker)].filter(s=>s&&!PRICES.closes[s]);
  if(need.length) await Promise.all(need.map(fetchChart));
  // a typed symbol that can't be priced (e.g. bare "2330") → adopt ONLY if there is a single
  // unambiguous listing. If a bare code exists on several exchanges (e.g. 6951 = JP/HK/TW),
  // never guess — leave it unresolved so the user picks the exact listing from the dropdown.
  if(!PRICES.closes[ticker] && !_triedResolve.has(ticker)){
    _triedResolve.add(ticker);
    try{
      const res=await fetch(`${WORKER}/search?q=${encodeURIComponent(ticker)}`).then(r=>r.ok?r.json():[]);
      const cands=(res||[]).filter(x=>["EQUITY","ETF"].includes(x.type));
      if(cands.length===1 && cands[0].symbol!==ticker){
        const top=cands[0];
        [...(BOOK.calls||[]),...(BOOK.holdings||[]),...(BOOK.coverage||[])].forEach(o=>{ if(o.ticker===ticker){ o.ticker=top.symbol; o.country=countryFromTicker(top.symbol); o.currency=ccyFromTicker(top.symbol); if(!o.name)o.name=top.name; } });
        save(); return ensurePriced(top.symbol);
      }
    }catch(e){}
  }
  const q=PRICES.quotes[ticker];
  if(q&&q.name){ [...(BOOK.calls||[]),...(BOOK.holdings||[]),...(BOOK.coverage||[])].forEach(o=>{ if(o.ticker===ticker&&!o.name)o.name=q.name; }); }
  cachePrices(); save(); render();
}
function cachePrices(){ try{ localStorage.setItem(LS_PRICES,JSON.stringify({t:Date.now(),quotes:PRICES.quotes,closes:PRICES.closes})); }catch(e){} }
function loadCachedPrices(){ try{ const c=JSON.parse(localStorage.getItem(LS_PRICES)||"null");
  if(c&&Date.now()-c.t<15*60*1000){ PRICES.quotes=c.quotes||{}; PRICES.closes=c.closes||{}; SORTED={}; for(const s in PRICES.closes)SORTED[s]=Object.keys(PRICES.closes[s]).sort(); } }catch(e){} }

/* ---------- price helpers (identical logic to scripts/verify_calls.py) ---------- */
function oob(sym,target){
  const ks=SORTED[sym]; if(!ks||!ks.length||!target) return null;
  let lo=0,hi=ks.length-1,res=null;
  while(lo<=hi){const m=(lo+hi)>>1; if(ks[m]<=target){res=m;lo=m+1;}else hi=m-1;}
  return res===null?null:PRICES.closes[sym][ks[res]];
}
function lastClose(sym){const ks=SORTED[sym]; return (ks&&ks.length)?PRICES.closes[sym][ks[ks.length-1]]:null;}
function quote(sym){return PRICES.quotes[sym]||null;}
function livePrice(sym){const q=quote(sym); return q&&q.price!=null?q.price:lastClose(sym);}
function scoreCall(c){
  const b=benchFromTicker(c.ticker), tk=c.ticker;
  const eP=oob(tk,c.entryDate);
  const xP=c.exitDate?oob(tk,c.exitDate):livePrice(tk);
  const be=oob(b,c.entryDate);
  const bx=c.exitDate?oob(b,c.exitDate):livePrice(b);   // use the live index level, not the (sometimes stale) last daily close
  let stockRet=null,benchRet=null,alpha=null,result="-";
  if(eP&&xP) stockRet=xP/eP-1;
  if(be&&bx) benchRet=bx/be-1;
  if(stockRet!=null&&benchRet!=null){
    alpha=stockRet-benchRet;
    const call=(c.call||"").toLowerCase();
    if(call==="buy") result=alpha>0?"HIT":"MISS";
    else if(call==="sell") result=alpha<0?"HIT":"MISS";
    else result="hold";
  }
  if(stockRet==null){ benchRet=null; alpha=null; }   // no index for an unpriced stock
  return {entryPx:eP,exitPx:xP,benchmark:b,stockRet,benchRet,alpha,result,open:!c.exitDate};
}
function analystSummary(id){   // KPI scope = the analyst's Alpha call log (every dated Buy/Sell/Hold = one graded call)
  const recs=(BOOK.calls||[]).filter(c=>c.analyst===id);
  const periods=[].concat(...recs.map(o=>alphaPeriods(o)));
  const scored=periods.filter(p=>p.result==="HIT"||p.result==="MISS");
  const hits=scored.filter(p=>p.result==="HIT").length;
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return {recs, periods,
    nNames:recs.length, nCalls:periods.length,
    openNames:recs.filter(o=>covState(o)==="active").length, closedNames:recs.filter(o=>covState(o)==="closed").length,
    scored:scored.length, hits, hitPct:scored.length?hits/scored.length:null,
    avgRet:mean(periods.map(p=>p.abs).filter(v=>v!=null)),
    avgAlpha:mean(periods.map(p=>p.rel).filter(v=>v!=null))};
}
const _mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const plur=(n,w)=>n+" "+w+(n===1?"":"s");
function coverageSummary(id){   // KPI scope = the analyst's coverage list (return since first covered)
  const cov=(BOOK.coverage||[]).filter(o=>o.analyst===id), tots=cov.map(covTotal);
  return {names:cov.length, changes:cov.reduce((n,o)=>n+((o.history||[]).length),0),
    avgRet:_mean(tots.map(t=>t.abs).filter(v=>v!=null)),
    avgRel:_mean(tots.map(t=>t.rel).filter(v=>v!=null))};
}
function totalSummary(id){      // KPI scope = Alpha calls + Coverage names pooled together
  const a=analystSummary(id), cov=(BOOK.coverage||[]).filter(o=>o.analyst===id).map(covTotal);
  const rets=[...a.periods.map(p=>p.abs), ...cov.map(t=>t.abs)].filter(v=>v!=null);
  const rels=[...a.periods.map(p=>p.rel), ...cov.map(t=>t.rel)].filter(v=>v!=null);
  return {avgRet:_mean(rets), avgRel:_mean(rels), calls:a.nCalls, names:cov.length};
}

function fmtDate(iso){ const p=(iso||"").split("-"); if(p.length<3) return iso||""; return `${+p[2]} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1]} ${p[0].slice(2)}`; }

/* ---------- ALPHA (locked per-name Buy/Sell/Hold call log — twin of Coverage, graded HIT/MISS) ---------- */
const CALL_OPTS=["Buy","Sell","Hold"], CALL_FULL={Buy:"Buy",Sell:"Sell",Hold:"Hold",CLOSED:"Closed"}, CALL_PILL={Buy:"buy",Sell:"sell",Hold:"hold",CLOSED:"hold"};
function callPill(v){return `<span class="pill ${CALL_PILL[v]||"hold"}" title="${CALL_FULL[v]||""}">${esc(v||"Hold")}</span>`;}
function starEl(o){const on=!!o.highConviction; return `<span class="star${on?" on":""}" data-star="${o.id}" title="${on?"High-conviction call — click to unmark":"Mark as a high-conviction call"}">${on?"★":"☆"}</span>`;}
function currentCall(o){ const h=activeSorted(o); return h.length?h[h.length-1].call:"Hold"; }

function renderHoldings(){
  const H=FUND_HOLDINGS;
  const present=COUNTRIES.filter(([code])=>H.some(h=>holdCountry(h)===code));
  const pills=COUNTRIES.map(([code,label])=>{const n=H.filter(h=>holdCountry(h)===code).length; return `<span class="tag" style="${n?"color:var(--text-2)":""}">${label}${n?" · "+n:""}</span>`;}).join(" ");
  const head=`<tr><th style="text-align:left">Stock</th><th class="num">Last price</th><th class="num">1D</th><th class="num">1W</th><th class="num">1M</th><th class="num">YTD</th></tr>`;
  const rowHtml=h=>{const ccy=ccyFromTicker(h.ticker), px=h.ticker?livePrice(h.ticker):null, q=(h.ticker&&quote(h.ticker))||{};
    const tk=h.ticker?`<span class="tk">${esc(h.ticker)}</span>`:`<span class="tk" style="color:var(--accent)" title="Ticker pending — send me the Yahoo symbol">ticker pending</span>`;
    return `<tr>
      <td style="text-align:left"><span style="font-family:'Manrope'">${esc(h.name)}</span> ${tk}</td>
      <td class="num">${px!=null?money(px,ccy):"–"}</td>
      <td class="num">${pctSpanRaw(q.d1)}</td><td class="num">${pctSpanRaw(q.w1)}</td><td class="num">${pctSpanRaw(q.m1)}</td><td class="num">${pctSpanRaw(q.ytd)}</td></tr>`;};
  let groups="";
  for(const [code,label] of present){

  }

}

const NUMF=new Set(["entry","exit","target"]);
const RENDER_ON=new Set(["call","entry","entryDate","exitDate","ticker"]);
function wire(){
  const v=document.getElementById("views");
  v.querySelectorAll(".seg [data-analyst]").forEach(b=>b.onclick=()=>{ if(b.dataset.analyst==="__new"){addAnalyst();return;} selAnalyst=b.dataset.analyst; section="calls"; syncHash(); render(); });

  v.querySelectorAll("[data-tilescope]").forEach(b=>b.onclick=()=>{ tileScope=b.dataset.tilescope; render(); });
  v.querySelectorAll("input.cell,select.cell").forEach(inp=>inp.addEventListener("change",e=>{
    const tr=e.target.closest("tr"); const coll=tr.dataset.coll, id=tr.dataset.id, f=e.target.dataset.f;
    const obj=(BOOK[coll]||[]).find(o=>o.id===id); if(!obj) return;
    let val=e.target.value;
    if(NUMF.has(f)) val=val===""?null:parseFloat(val);
    if(f==="exitDate"&&val==="") val=null;
    obj[f]=val;
    if(f==="ticker"){ obj.country=countryFromTicker(val); obj.currency=ccyFromTicker(val); save(); ensurePriced(val); return; }
    save(); if(RENDER_ON.has(f)) render();
  }));
  v.querySelectorAll("[data-del]").forEach(d=>d.onclick=e=>{const tr=e.target.closest("tr"); BOOK[tr.dataset.coll]=BOOK[tr.dataset.coll].filter(o=>o.id!==tr.dataset.id); save(); render();});
  const addC=v.querySelector("[data-addcall]"); if(addC) addC.onclick=addCall;
  const addH=v.querySelector("[data-addhold]"); if(addH) addH.onclick=addHolding;
  const addCov=v.querySelector("[data-addcov]"); if(addCov) addCov.onclick=addCoverage;
  v.querySelectorAll("[data-note]").forEach(n=>n.onclick=e=>rationaleModal(n.dataset.ncoll,n.dataset.nid));
  // coverage: locked calls — Change (new dated call) · Close (freeze) · Reopen · soft-delete/restore · expand
  v.querySelectorAll("[data-covchange]").forEach(b=>b.onclick=()=>changeRatingModal(b.dataset.covchange));
  v.querySelectorAll("[data-covclose]").forEach(b=>b.onclick=()=>closeCoverageModal(b.dataset.covclose));

  v.querySelectorAll("[data-covtoggle]").forEach(t=>t.onclick=e=>{const id=e.target.closest("tr").dataset.id; openCov.has(id)?openCov.delete(id):openCov.add(id); render();});
  v.querySelectorAll("[data-covdel]").forEach(d=>d.onclick=e=>covDel(d.dataset.covdel));
  v.querySelectorAll("[data-covrestore]").forEach(r=>r.onclick=e=>covRestore(r.dataset.covrestore));
  // alpha: locked Buy/Sell/Hold calls — Set call/Change · Close (freeze) · Reopen (toggle/delete/restore reuse the coverage handlers above)
  v.querySelectorAll("[data-callchange]").forEach(b=>b.onclick=()=>logCallModal(b.dataset.callchange));
  v.querySelectorAll("[data-callclose]").forEach(b=>b.onclick=()=>closeAlphaModal(b.dataset.callclose));
  v.querySelectorAll("[data-callreopen]").forEach(b=>b.onclick=()=>{const o=(BOOK.calls||[]).find(x=>x.id===b.dataset.callreopen); if(o){delete o.closeDate; save(); render();}});
  // high-conviction star — editors toggle; readers see only the gold ★ (CSS .viewonly gating)
  v.querySelectorAll("[data-star]").forEach(s=>s.onclick=()=>{ const o=[...(BOOK.calls||[]),...(BOOK.coverage||[])].find(x=>x.id===s.dataset.star); if(!o||!canEdit(o.analyst))return; o.highConviction=!o.highConviction; save(); render(); });
  attachTickerSearch();
  v.querySelectorAll("[data-chart]").forEach(s=>s.onclick=()=>openChart(s.dataset.chart,s.dataset.nm));
  const pdfBtn=v.querySelector("#btnPdf"), pdfIn=v.querySelector("#pdfInput");
  if(pdfBtn&&pdfIn){ pdfBtn.onclick=()=>pdfIn.click(); pdfIn.onchange=e=>{const f=e.target.files[0]; if(f) handlePdf(f); e.target.value="";}; }
}

function ensureDD(){ if(!_dd){ _dd=document.createElement("div"); _dd.id="tickerDD"; _dd.style.cssText="position:absolute;z-index:90;display:none;background:var(--surface);border:1px solid var(--border-2);border-radius:9px;box-shadow:0 10px 28px rgba(0,0,0,.45);max-height:290px;overflow:auto;font-size:13px"; document.body.appendChild(_dd); window.addEventListener("scroll",hideDD,true); } return _dd; }
function hideDD(){ if(_dd)_dd.style.display="none"; _ddIdx=-1; }
function hlDD(){ if(!_dd)return; _dd.querySelectorAll("[data-idx]").forEach((el,i)=>{ el.style.background = i===_ddIdx?"var(--accent-dim)":"transparent"; }); const cur=_dd.querySelector(`[data-idx="${_ddIdx}"]`); if(cur) cur.scrollIntoView({block:"nearest"}); }
function attachTickerSearch(){
  document.querySelectorAll('input.cell[data-f="ticker"]').forEach(inp=>{
    inp.setAttribute("autocomplete","off");
    inp.addEventListener("input",()=>{ clearTimeout(_ddT); const q=inp.value.trim(); if(!q){hideDD();return;} _ddT=setTimeout(()=>runSearch(inp,q),250); });
    inp.addEventListener("focus",()=>{ const q=inp.value.trim(); if(q){ clearTimeout(_ddT); _ddT=setTimeout(()=>runSearch(inp,q),200); } });
    inp.addEventListener("keydown",e=>{
      const open=_dd&&_dd.style.display!=="none"&&_ddItems.length;
      if(e.key==="Escape"){ hideDD(); return; }
      if(!open) return;
      if(e.key==="ArrowDown"){ e.preventDefault(); _ddIdx=Math.min(_ddIdx+1,_ddItems.length-1); hlDD(); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); _ddIdx=Math.max(_ddIdx-1,-1); hlDD(); }
      else if(e.key==="Enter"){ let i=_ddIdx; if(i<0&&_ddItems.length===1) i=0; if(i>=0){ e.preventDefault(); pickTicker(inp,_ddItems[i].symbol,_ddItems[i].name); } }
    });
    inp.addEventListener("blur",()=>setTimeout(hideDD,150));
  });
}
async function runSearch(inp,q){
  let items=[]; try{ const r=await fetch(`${WORKER}/search?q=${encodeURIComponent(q)}`); if(r.ok)items=await r.json(); }catch(e){}
  _ddItems=items; _ddIdx=-1;
  const dd=ensureDD();
  dd.innerHTML = items.length ? items.map((it,i)=>`<div data-idx="${i}" style="padding:7px 11px;cursor:pointer;display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--border)"><span><b style="font-family:var(--mono)">${esc(it.symbol)}</b> <span style="color:var(--text-2)">${esc(it.name)}</span></span><span style="color:var(--muted);font-size:11px">${esc(it.exchange)}</span></div>`).join("")
    : `<div style="padding:8px 11px;color:var(--muted)">No matches for “${esc(q)}” — check the code</div>`;
  const rct=inp.getBoundingClientRect();
  dd.style.left=(rct.left+scrollX)+"px"; dd.style.top=(rct.bottom+scrollY+3)+"px"; dd.style.minWidth=Math.max(rct.width,300)+"px"; dd.style.display="block";
  dd.querySelectorAll("[data-idx]").forEach(row=>{ const i=+row.dataset.idx;
    row.addEventListener("mousedown",e=>{ e.preventDefault(); pickTicker(inp,_ddItems[i].symbol,_ddItems[i].name); });
    row.addEventListener("mouseenter",()=>{ _ddIdx=i; hlDD(); });
  });
}
function pickTicker(inp,sym,name){
  const tr=inp.closest("tr"); if(!tr)return; const obj=(BOOK[tr.dataset.coll]||[]).find(o=>o.id===tr.dataset.id); if(!obj)return;
  obj.ticker=sym; obj.name=name||obj.name; obj.country=countryFromTicker(sym); obj.currency=ccyFromTicker(sym);
  inp.value=sym;   // reflect the resolved symbol so a later blur `change` re-commits the same symbol, not the raw typed text
  hideDD(); save(); ensurePriced(sym);   // ensurePriced ends with render() → the row refreshes with price + name
}

/* ---------- price chart modal ---------- */
function openChart(sym,nm){
  const cm=PRICES.closes[sym]; if(!cm){alert("No price history for "+sym);return;}
  const ks=Object.keys(cm).sort().slice(-180);
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="modal"><div class="box"><span class="x" id="mx">×</span><h3>${esc(nm||sym)}</h3><div class="small">${esc(sym)} · adjusted close, ~6 months</div><div class="chartbox" style="margin-top:10px"><canvas id="mChart"></canvas></div></div></div>`;
  root.querySelector(".modal").onclick=e=>{if(e.target.classList.contains("modal"))root.innerHTML="";};
  document.getElementById("mx").onclick=()=>root.innerHTML="";
  if(window.Chart) new Chart(document.getElementById("mChart"),{type:"line",data:{labels:ks,datasets:[{data:ks.map(k=>cm[k]),borderColor:"#e9a23b",backgroundColor:"rgba(233,162,59,.12)",fill:true,tension:.2,pointRadius:0,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6}},y:{grid:{color:"rgba(255,255,255,.06)"}}}}});
}

/* ---------- PDF upload → parse → review → fill Holdings ---------- */
const SAMPLE_STMT=`Portfolio Statement as of 29 Jul 2026
Stock                     Qty       Avg Cost
Reliance Industries       145265    1308.00
TSMC                      5000      1100.00
Tencent Holdings          8000      620.00
DBS Group Holdings        3000      38.50
Samsung Electronics       12000     71000.00`;
function parseHoldingsText(text){
  // PDF text arrives word-by-word (many spaces). Take the full name = everything before
  // the first number; cost = the first decimal number (prices carry decimals), else the
  // last integer. Rows are always reviewed before saving, so err toward capturing.
  const out=[];
  text.split(/\r?\n/).forEach(raw=>{
    const line=raw.replace(/\s+/g," ").trim();
    if(!line) return;
    if(/^(total|subtotal|grand total|net|cash|balance|opening|closing)\b/i.test(line)) return;
    if(/\b(qty|quantity|avg\s*cost|market\s*value|statement|portfolio|symbol|units?|as of|shares?)\b/i.test(line) && !/\d[\d,]*\.\d/.test(line)) return;
    const m=line.match(/^([A-Za-z][A-Za-z0-9 .&'\/\-]*?)\s+([\d(].*)$/);
    if(!m) return;
    const name=m[1].trim(), rest=m[2];
    const decs=rest.match(/\d[\d,]*\.\d+/g), ints=rest.match(/\d[\d,]+/g);
    if(name.length<2 || (!decs && !ints)) return;
    const cost=parseFloat((decs?decs[0]:ints[ints.length-1]).replace(/,/g,""));
    out.push({name, ticker:"", cost:isNaN(cost)?null:cost, country:""});
  });
  return out;
}
async function handlePdf(file){
  toast(`<span class="spin"></span> Reading ${esc(file.name)}…`);
  let text="";
  try{ text=await extractPdfText(await file.arrayBuffer()); }
  catch(e){ toast(""); alert("Could not read PDF: "+e.message); return; }
  let rows=parseHoldingsText(text);
  toast("");
  if(!rows||!rows.length){ alert("Couldn't find any holdings in that PDF — try adding rows manually."); return; }
  reviewHoldings(rows,file.name);
}
async function extractPdfText(buf){
  const pdfjs=window.pdfjsLib;
  if(!pdfjs) throw new Error("PDF library still loading — try again in a second");
  pdfjs.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  const doc=await pdfjs.getDocument({data:buf}).promise;
  let out="";
  for(let p=1;p<=doc.numPages;p++){
    const content=await (await doc.getPage(p)).getTextContent();
    let lastY=null,line="";
    for(const it of content.items){ const y=it.transform[5];
      if(lastY!==null&&Math.abs(y-lastY)>3){ out+=line.trimEnd()+"\n"; line=""; }
      line+=it.str+(it.hasEOL?"":"  "); lastY=y; }
    out+=line+"\n";
  }
  return out;
}
async function extractWithClaude(text,key){
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-5",max_tokens:2000,messages:[{role:"user",content:`Extract the holdings from this brokerage/portfolio statement. Return ONLY a JSON array of objects {"name","ticker","cost","country"} — name=company name; ticker=Yahoo symbol if inferable else ""; cost=average cost per share as a number; country one of HK,CN,IN,TW,KR,ASEAN,US,JP. No prose.\n\n${text.slice(0,12000)}`}]})});
  if(!res.ok) throw new Error("Anthropic "+res.status);
  const j=await res.json(); const raw=(j.content&&j.content[0]&&j.content[0].text)||"[]";
  return JSON.parse(raw.slice(raw.indexOf("["),raw.lastIndexOf("]")+1));
}
function reviewHoldings(rows,src){
  const root=document.getElementById("modalRoot");
  const opts=c=>COUNTRIES.map(([code,label])=>`<option value="${code}" ${c===code?"selected":""}>${label}</option>`).join("");
  const body=rows.map((r,i)=>`<tr data-i="${i}">
    <td><input class="cell w-name" data-rf="name" value="${esc(r.name||"")}"></td>
    <td><input class="cell w-tk" data-rf="ticker" value="${esc(r.ticker||"")}" placeholder="e.g. 2330.TW"></td>
    <td><select class="cell w-sm" data-rf="country">${opts(r.country||"")}</select></td>
    <td><input class="cell w-sm" data-rf="cost" type="number" value="${r.cost??""}"></td>
    <td><span class="del" data-rdel>✕</span></td></tr>`).join("");
  root.innerHTML=`<div class="modal"><div class="box"><span class="x" id="mx">×</span><h3>Review extracted holdings</h3>
    <div class="small">From ${esc(src)} · ${rows.length} row(s). Add a Yahoo ticker (with suffix) so prices resolve. Fix anything, then add.</div>
    <div class="note">This is a draft from the PDF — nothing is saved until you click Add.</div>
    <div class="tw"><table><thead><tr><th>Name</th><th>Ticker</th><th>Country</th><th class="num">Cost</th><th></th></tr></thead><tbody id="revBody">${body}</tbody></table></div>
    <div class="addbar"><button class="btn gold" id="revAdd">Add ${rows.length} holding(s)</button><button class="btn ghost" id="revCancel">Cancel</button></div></div></div>`;
  const state=rows.map(r=>({...r}));
  root.querySelector("#mx").onclick=root.querySelector("#revCancel").onclick=()=>root.innerHTML="";
  root.querySelectorAll("#revBody [data-rf]").forEach(inp=>inp.addEventListener("change",e=>{const i=+e.target.closest("tr").dataset.i,f=e.target.dataset.rf; state[i][f]=f==="cost"?(e.target.value===""?null:parseFloat(e.target.value)):e.target.value;}));
  root.querySelectorAll("#revBody [data-rdel]").forEach(d=>d.onclick=e=>{const i=+e.target.closest("tr").dataset.i; state[i]._x=true; e.target.closest("tr").remove();});
  root.querySelector("#revAdd").onclick=()=>{
    state.filter(r=>!r._x&&(r.name||r.ticker)).forEach(r=>{const tk=(r.ticker||"").trim(); BOOK.holdings.push({id:"h-"+Math.random().toString(36).slice(2,8),name:r.name||"",ticker:tk,country:r.country||countryFromTicker(tk),currency:ccyFromTicker(tk),entry:r.cost??null,entryDate:"",source:"pdf import",notes:""});});
    save(); root.innerHTML=""; view="holdings"; buildNav(); render();
  };
}
function toast(html){let t=document.getElementById("toast"); if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border-2);padding:9px 16px;border-radius:10px;z-index:80;font-size:13px";document.body.appendChild(t);} if(!html){t.remove();return;} t.innerHTML=html;}

function emptyRow(cols,msg){return `<tr><td colspan="${cols}" style="text-align:center;color:var(--muted);padding:22px">${msg||"Nothing here yet."}</td></tr>`;}
