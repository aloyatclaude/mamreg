<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Portal — Calls by Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0c0f14; --surface:#151a22; --surface-2:#1b212b; --raise:#222a35;
  --border:rgba(255,255,255,0.08); --border-2:rgba(255,255,255,0.14);
  --text:#e8eaed; --text-2:#a7adb8; --muted:#6f7681;
  --accent:#e9a23b; --accent-dim:rgba(233,162,59,0.14);
  --up:#3fc78a; --down:#f06a6a; --up-bg:rgba(63,199,138,0.12); --down-bg:rgba(240,106,106,0.12);
  --mono:'Roboto Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 620px at 82% -8%, rgba(233,162,59,0.07), transparent 60%),
    radial-gradient(900px 520px at -6% 4%, rgba(57,135,229,0.06), transparent 55%),
    var(--page);
  color:var(--text); font-family:'Manrope',system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.45; min-height:100vh;
}
.app{display:flex; min-height:100vh}
.side{width:200px; flex:0 0 200px; border-right:1px solid var(--border); padding:22px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px}
.brand{font-family:'Fraunces',serif; font-size:19px; font-weight:600; padding:0 8px 2px; line-height:1.2}
.brand small{display:block; font-family:'Manrope'; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-top:5px}
.nav{margin-top:16px; display:flex; flex-direction:column; gap:2px}
.nav-item{display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:9px; cursor:pointer; color:var(--text-2); font-weight:600; font-size:13.5px; user-select:none}
.nav-item:hover{background:var(--surface); color:var(--text)}
.nav-item.active{background:var(--accent-dim); color:var(--accent)}
.nav-item .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.side-foot{margin-top:auto; font-size:10.5px; color:var(--muted); padding:8px; line-height:1.5}
.main{flex:1; min-width:0; padding:22px 26px 60px}
.topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px}
.topbar h1{font-family:'Fraunces',serif; font-weight:600; font-size:23px; margin:0}
.topbar .sub{color:var(--muted); font-size:12px; margin-top:3px}
.tb-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.btn{background:var(--surface); border:1px solid var(--border-2); color:var(--text); padding:7px 13px; border-radius:8px; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.gold{background:var(--accent); color:#1a1204; border-color:transparent}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px; font-size:12px}
.grid{display:grid; gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin-bottom:16px}
.tile{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:13px 15px}
.tile .k{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}
.tile .v{font-size:23px; font-weight:600; margin-top:5px; font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px; color:var(--text-2); font-weight:500}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:16px}
.panel h2{font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin:0 0 3px}
.panel .desc{color:var(--muted); font-size:12px; margin-bottom:12px}
.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; margin-bottom:14px; flex-wrap:wrap}
.seg button{background:transparent; border:0; color:var(--text-2); font:inherit; font-weight:600; font-size:13px; padding:6px 14px; border-radius:7px; cursor:pointer}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent); color:#1a1204}
.seg.small button{font-size:12px; padding:5px 12px}
.tw{overflow-x:auto; border-radius:10px}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{padding:7px 9px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
input[type=number].cell::-webkit-outer-spin-button,input[type=number].cell::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number].cell{-moz-appearance:textfield}
input[type=date].cell{min-width:104px}
th{color:var(--muted); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:700}
tbody tr:hover{background:rgba(255,255,255,0.025)}
td.num,th.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.name{font-weight:600}
.tk{color:var(--muted); font-size:11px; font-family:var(--mono); margin-left:6px}
.link{cursor:pointer; border-bottom:1px dashed rgba(255,255,255,0.2)}
.link:hover{color:var(--accent); border-color:var(--accent)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--text-2)}
.grp-head td{background:var(--surface-2); color:var(--text-2); font-size:11px; letter-spacing:.05em; text-transform:uppercase; font-weight:700; text-align:left; padding-top:9px; padding-bottom:9px}
.grp-head .cnt{color:var(--muted); font-weight:600}
.subtotal td{border-top:1px solid var(--border-2); font-weight:700; color:var(--text-2); background:rgba(255,255,255,0.02)}
input.cell, select.cell{background:var(--surface-2); border:1px solid transparent; color:var(--text); font:inherit; font-size:12.5px; padding:4px 7px; border-radius:6px; width:100%; min-width:56px; font-variant-numeric:tabular-nums}
input.cell{text-align:right; font-family:var(--mono)}
td:first-child input.cell{text-align:left; font-family:'Manrope'}
input.cell:focus, select.cell:focus{outline:none; border-color:var(--accent); background:var(--raise)}
input.cell::placeholder{color:var(--muted)}
select.cell{cursor:pointer; -webkit-appearance:none; appearance:none}
.w-name{min-width:150px} .w-tk{min-width:96px} .w-sm{width:92px} .w-dt{width:110px} .w-xs{width:74px}
.pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700}
.pill.buy{background:var(--up-bg); color:var(--up)} .pill.sell{background:var(--down-bg); color:var(--down)} .pill.hold{background:rgba(167,173,184,.14); color:var(--text-2)}
.badge{display:inline-block; padding:2px 8px; border-radius:6px; font-size:10.5px; font-weight:700}
.badge.hit{background:var(--up-bg); color:var(--up)} .badge.miss{background:var(--down-bg); color:var(--down)} .badge.na{background:rgba(167,173,184,.12); color:var(--muted)}
.del{cursor:pointer; color:var(--muted); font-weight:700; padding:2px 6px; border-radius:6px}
.del:hover{color:var(--down); background:var(--down-bg)}
.addbar{display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap}
.small{font-size:11px;color:var(--muted)}
.tag{font-size:10px; color:var(--muted); background:var(--surface-2); border:1px solid var(--border); padding:1px 6px; border-radius:5px; font-family:var(--mono)}
.chartbox{position:relative; height:260px}
.modal{position:fixed; inset:0; background:rgba(4,6,10,.7); display:flex; align-items:center; justify-content:center; z-index:60; padding:20px}
.modal .box{background:var(--surface); border:1px solid var(--border-2); border-radius:14px; padding:18px; width:min(720px,95vw); max-height:90vh; overflow:auto}
.modal h3{font-family:'Fraunces',serif; margin:0 0 4px; font-size:17px}
.modal .x{float:right; cursor:pointer; color:var(--muted); font-size:22px; line-height:1}
.field{margin:12px 0}
.field label{display:block; font-size:12px; color:var(--text-2); font-weight:600; margin-bottom:4px}
.field input{width:100%; background:var(--surface-2); border:1px solid var(--border-2); color:var(--text); padding:8px 10px; border-radius:8px; font:inherit; font-size:13px}
.note{background:var(--accent-dim); border:1px solid rgba(233,162,59,.3); color:#f0c98a; padding:8px 12px; border-radius:9px; font-size:12px; margin:10px 0}
.hidden{display:none!important}
.aname{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.aname i{width:10px;height:10px;border-radius:3px;display:inline-block}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border-2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body data-palette="#3987e5,#199e70,#c98500,#008300,#9085e9,#e66767,#d55181,#d95926">
<div class="app">
  <aside class="side">
    <div class="brand">Research Portal<small>Calls by analyst</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="foot">loading…</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h1 id="viewTitle">Analysts</h1><div class="sub" id="viewSub"></div></div>
      <div class="tb-actions">
        <button class="btn ghost sm" id="btnSettings" title="API key & GitHub token">⚙ Settings</button>
        <button class="btn ghost sm" id="btnReset" title="Discard local edits, reload published book">Reset</button>
        <button class="btn sm" id="btnExport" title="Download book.json">Export</button>
        <button class="btn gold sm" id="btnPublish" title="Commit book.json to the repo (needs token)">Publish</button>
      </div>
    </div>
    <div id="views"></div>
  </main>
</div>
<div id="modalRoot"></div>

<script>
"use strict";
/* ---------- ticker-suffix → benchmark / country / currency (mirrors scripts/*.py) ---------- */
const SUFFIX_BENCH={".HK":"^HSI",".SS":"000300.SS",".SZ":"000300.SS",".NS":"^CRSLDX",".BO":"^BSESN",".TW":"^TWII",".TWO":"^TWII",".KS":"^KS11",".KQ":"^KS11",".SI":"^STI",".KL":"^KLSE",".BK":"^SET.BK",".JK":"^JKSE",".PS":"^PSI",".T":"^N225"};
const SUFFIX_COUNTRY={".HK":"HK",".SS":"CN",".SZ":"CN",".NS":"IN",".BO":"IN",".TW":"TW",".TWO":"TW",".KS":"KR",".KQ":"KR",".SI":"ASEAN",".KL":"ASEAN",".BK":"ASEAN",".JK":"ASEAN",".PS":"ASEAN",".T":"JP"};
const SUFFIX_CCY={".HK":"HKD",".SS":"CNY",".SZ":"CNY",".NS":"INR",".BO":"INR",".TW":"TWD",".TWO":"TWD",".KS":"KRW",".KQ":"KRW",".SI":"SGD",".KL":"MYR",".BK":"THB",".JK":"IDR",".PS":"PHP",".T":"JPY"};
const BENCH_NAME={"^HSI":"Hang Seng","000300.SS":"CSI 300","^CRSLDX":"Nifty 500","^BSESN":"Sensex","^TWII":"TAIEX","^KS11":"KOSPI","^STI":"STI","^KLSE":"KLCI","^SET.BK":"SET","^JKSE":"JKSE","^PSI":"PSEi","^N225":"Nikkei","^GSPC":"S&P 500"};
const CUR_SYM={INR:"₹",TWD:"NT$",KRW:"₩",USD:"$",HKD:"HK$",JPY:"¥",CNY:"¥",SGD:"S$",MYR:"RM",THB:"฿",IDR:"Rp",PHP:"₱"};
const COUNTRIES=[["HK","Hong Kong"],["CN","China"],["IN","India"],["TW","Taiwan"],["KR","Korea"],["ASEAN","ASEAN"],["US","United States"],["JP","Japan"]];
const REPO="mamreg/mamreg";
const LS_BOOK="grp-book-v2", LS_CLAUDE="grp-claude-key", LS_GH="grp-gh-token";
const TABS=[["analysts","Analysts"],["holdings","Holdings"]];
const ANALYST_COLORS=["#3987e5","#199e70","#c98500","#9085e9","#e66767","#d55181"];

const sfx=t=>{const i=(t||"").lastIndexOf(".");return i>0?t.slice(i):"";};
const benchFromTicker=t=>SUFFIX_BENCH[sfx(t)]||"^GSPC";
const countryFromTicker=t=>SUFFIX_COUNTRY[sfx(t)]||"US";
const ccyFromTicker=t=>SUFFIX_CCY[sfx(t)]||"USD";

let BOOK=null, PRICES={quotes:{},closes:{},fx:{},generated:null}, SEED=null;
let SORTED={};
let view="analysts", selAnalyst=null, section="calls";
let charts={};

/* ---------- load / save ---------- */
async function load(){
  const [bk,pr]=await Promise.all([
    fetch("data/book.json").then(r=>r.json()),
    fetch("data/prices.json").then(r=>r.ok?r.json():null).catch(()=>null)
  ]);
  SEED=bk;
  const saved=localStorage.getItem(LS_BOOK);
  BOOK=saved?JSON.parse(saved):structuredClone(bk);
  if(!BOOK.holdings)BOOK.holdings=[]; if(!BOOK.calls)BOOK.calls=[]; if(!BOOK.analysts)BOOK.analysts=[];
  if(pr) PRICES=pr;
  SORTED={}; for(const s in PRICES.closes) SORTED[s]=Object.keys(PRICES.closes[s]).sort();
  parseHash();
  if(!selAnalyst&&BOOK.analysts[0]) selAnalyst=BOOK.analysts[0].id;
  buildNav(); render();
  const gen=PRICES.generated?new Date(PRICES.generated):null;
  document.getElementById("foot").innerHTML=`Prices: Yahoo, indicative<br>${gen?("refreshed "+gen.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})):"no price feed"}<br><span class="small">returns from adjusted closes</span>`;
  if(new URLSearchParams(location.search).has("pdftest")) setTimeout(()=>reviewHoldings(parseHoldingsText(SAMPLE_STMT),"self-test sample"),300);
}
function save(){BOOK.updated=new Date().toISOString().slice(0,10); localStorage.setItem(LS_BOOK,JSON.stringify(BOOK));}

/* ---------- price helpers (identical logic to scripts/verify_calls.py) ---------- */
function oob(sym,target){
  const ks=SORTED[sym]; if(!ks||!ks.length||!target) return null;
  let lo=0,hi=ks.length-1,res=null;
  while(lo<=hi){const m=(lo+hi)>>1; if(ks[m]<=target){res=m;lo=m+1;}else hi=m-1;}
  return res===null?null:PRICES.closes[sym][ks[res]];
}
function lastClose(sym){const ks=SORTED[sym]; return (ks&&ks.length)?PRICES.closes[sym][ks[ks.length-1]]:null;}
function quote(sym){return PRICES.quotes[sym]||null;}
function livePrice(sym){const q=quote(sym); return q&&q.price!=null?q.price:lastClose(sym);}
function scoreCall(c){
  const b=benchFromTicker(c.ticker), tk=c.ticker;
  const eP=oob(tk,c.entryDate);
  const xP=c.exitDate?oob(tk,c.exitDate):livePrice(tk);
  const be=oob(b,c.entryDate);
  const bx=c.exitDate?oob(b,c.exitDate):lastClose(b);
  let stockRet=null,benchRet=null,alpha=null,result="-";
  if(eP&&xP) stockRet=xP/eP-1;
  if(be&&bx) benchRet=bx/be-1;
  if(stockRet!=null&&benchRet!=null){
    alpha=stockRet-benchRet;
    const call=(c.call||"").toLowerCase();
    if(call==="buy") result=alpha>0?"HIT":"MISS";
    else if(call==="sell") result=alpha<0?"HIT":"MISS";
    else result="hold";
  }
  return {entryPx:eP,exitPx:xP,benchmark:b,stockRet,benchRet,alpha,result,open:!c.exitDate};
}
function analystSummary(id){
  const calls=(BOOK.calls||[]).filter(c=>c.analyst===id).map(c=>({c,s:scoreCall(c)}));
  const scored=calls.filter(x=>x.s.result==="HIT"||x.s.result==="MISS");
  const hits=scored.filter(x=>x.s.result==="HIT").length;
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return {calls, open:calls.filter(x=>x.s.open), closed:calls.filter(x=>!x.s.open),
    nNames:new Set(calls.map(x=>x.c.ticker)).size,
    scored:scored.length, hits, hitPct:scored.length?hits/scored.length:null,
    avgRet:mean(calls.map(x=>x.s.stockRet).filter(v=>v!=null)),
    avgAlpha:mean(calls.map(x=>x.s.alpha).filter(v=>v!=null))};
}

/* ---------- formatting ---------- */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const nf=(v,d=2)=>v==null||isNaN(v)?"–":Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
function pctSpan(v,dp=2){ if(v==null||isNaN(v)) return '<span class="flat">–</span>'; const p=v*100; return pctSpanRaw(p,dp); }
function pctSpanRaw(p,dp=2){ if(p==null||isNaN(p)) return '<span class="flat">–</span>'; const c=p>0.0001?"up":(p<-0.0001?"down":"flat"),s=p>0?"+":""; return `<span class="${c}">${s}${p.toFixed(dp)}%</span>`; }
function money(v,ccy){ if(v==null||isNaN(v)) return "–"; return (CUR_SYM[ccy]||"")+Number(v).toLocaleString(undefined,{maximumFractionDigits:2}); }
function analystColor(id){const i=(BOOK.analysts||[]).findIndex(a=>a.id===id); return ANALYST_COLORS[(i<0?0:i)%ANALYST_COLORS.length];}
function analystName(id){const a=(BOOK.analysts||[]).find(x=>x.id===id); return a?a.name:(id||"—");}

/* ---------- shell / routing ---------- */
function buildNav(){
  document.getElementById("nav").innerHTML=TABS.map(([id,label])=>`<div class="nav-item ${id===view?"active":""}" data-view="${id}"><span class="dot"></span>${label}</div>`).join("");
  document.querySelectorAll(".nav-item").forEach(n=>n.onclick=()=>{view=n.dataset.view; syncHash(); buildNav(); render();});
}
function parseHash(){
  const parts=(location.hash||"").replace(/^#/,"").split("/").filter(Boolean);
  if(parts[0]&&TABS.some(t=>t[0]===parts[0])) view=parts[0];
  if(view==="analysts"){ if(parts[1]) selAnalyst=parts[1]; if(parts[2]&&["calls","historical","coverage"].includes(parts[2])) section=parts[2]; }
}
function syncHash(){ let h="#"+view; if(view==="analysts") h+="/"+(selAnalyst||"")+"/"+section; try{history.replaceState(null,"",h);}catch(e){} }
window.addEventListener("hashchange",()=>{const before=view+selAnalyst+section; parseHash(); if(view+selAnalyst+section!==before){buildNav();render();}});
const SUB={analysts:"Record & grade calls by analyst — return, vs-benchmark and hit rate",holdings:"Positions by country — cost and day/week/month/YTD returns"};
function render(){
  document.getElementById("viewTitle").textContent=TABS.find(t=>t[0]===view)[1];
  document.getElementById("viewSub").textContent=SUB[view]||"";
  Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}}); charts={};
  const v=document.getElementById("views");
  v.innerHTML = view==="holdings" ? renderHoldings() : renderAnalysts();
  wire();
}

/* ---------- ANALYSTS ---------- */
function renderAnalysts(){
  const analysts=BOOK.analysts||[];
  if(!selAnalyst&&analysts[0]) selAnalyst=analysts[0].id;
  const tabs=`<div class="seg">${analysts.map(a=>`<button class="${a.id===selAnalyst?"on":""}" data-analyst="${a.id}">${esc(a.name)}</button>`).join("")}<button data-analyst="__new" title="Add analyst">＋</button></div>`;
  const sum=analystSummary(selAnalyst);
  const tiles=`<div class="grid tiles">
    <div class="tile"><div class="k">Overall return</div><div class="v">${pctSpan(sum.avgRet)}</div><div class="small">avg per call</div></div>
    <div class="tile"><div class="k">Hit rate</div><div class="v">${sum.hitPct==null?"–":Math.round(sum.hitPct*100)+"%"}</div><div class="small">${sum.hits}/${sum.scored} scored${sum.scored<5?" · small sample":""}</div></div>
    <div class="tile"><div class="k">Return vs benchmark</div><div class="v">${pctSpan(sum.avgAlpha)}</div><div class="small">avg alpha per call</div></div>
    <div class="tile"><div class="k">Calls</div><div class="v">${sum.calls.length} <small>${sum.open.length} open · ${sum.closed.length} closed</small></div><div class="small">${sum.nNames} names</div></div>
  </div>`;
  const segs=`<div class="seg small">${[["calls","Alpha"],["historical","Historical Trades"],["coverage","Coverage List"]].map(s=>`<button class="${s[0]===section?"on":""}" data-section="${s[0]}">${s[1]}</button>`).join("")}</div>`;
  let body="";
  if(section==="calls") body=callsTable(sum.open,true);
  else if(section==="historical") body=callsTable(sum.closed,false);
  else body=coverageTable(sum);
  return tabs+tiles+`<div class="panel">${segs}${body}</div>`;
}
function callRow(x,openMode){
  const c=x.c,s=x.s;
  return `<tr data-id="${c.id}" data-coll="calls">
    ${stockCell(c)}
    <td>${callSelect(c.call)}</td>
    <td class="num">${s.entryPx!=null?nf(s.entryPx):"–"}</td>
    <td><input class="cell w-dt" data-f="entryDate" type="date" value="${esc(c.entryDate||"")}"></td>
    <td class="num">${s.open?'<span class="flat">—</span>':(s.exitPx!=null?nf(s.exitPx):"–")}</td>
    <td><input class="cell w-dt" data-f="exitDate" type="date" value="${esc(c.exitDate||"")}"></td>
    <td class="num">${pctSpan(s.stockRet)}</td>
    <td class="num">${pctSpan(s.benchRet)}</td>
    <td class="num">${pctSpan(s.alpha)}</td>
    <td class="num">${resultBadge(s.result,s.open)}</td>
    <td><span class="del" data-del>✕</span></td></tr>`;
}
function callsTable(rows,openMode){
  const bench=rows[0]?BENCH_NAME[rows[0].s.benchmark]||"Index":"Index";
  const scored=rows.filter(x=>x.s.result==="HIT"||x.s.result==="MISS");
  const hits=scored.filter(x=>x.s.result==="HIT").length;
  const mean=a=>a.length?a.reduce((p,q)=>p+q,0)/a.length:null;
  const avgR=mean(rows.map(x=>x.s.stockRet).filter(v=>v!=null));
  const avgA=mean(rows.map(x=>x.s.alpha).filter(v=>v!=null));
  const avgB=mean(rows.map(x=>x.s.benchRet).filter(v=>v!=null));
  const head=`<tr><th>Stock</th><th>Call</th><th class="num">Entry</th><th>Entry date</th><th class="num">Exit</th><th>Exit date</th><th class="num">Return</th><th class="num">vs Index</th><th class="num">+/−</th><th class="num">Result</th><th></th></tr>`;
  const foot=rows.length?`<tr class="subtotal"><td>${openMode?"Open":"Realized"} · ${rows.length}</td><td colspan="5">Hit rate ${scored.length?Math.round(100*hits/scored.length)+"% ("+hits+"/"+scored.length+")":"–"}</td><td class="num">${pctSpan(avgR)}</td><td class="num">${pctSpan(avgB)}</td><td class="num">${pctSpan(avgA)}</td><td colspan="2"></td></tr>`:"";
  const desc=`<div class="desc">${openMode?"Open calls, marked-to-market.":"Closed calls, realized."} Return = stock; vs Index = ${esc(bench)} over the same dates; +/− = alpha. Hit/miss on alpha (Hold excluded).</div>`;
  const body=rows.length?rows.map(x=>callRow(x,openMode)).join(""):emptyRow(11,openMode?"No open calls.":"No closed trades yet.");
  return desc+`<div class="tw"><table><thead>${head}</thead><tbody>${body}</tbody>${foot?`<tfoot>${foot}</tfoot>`:""}</table></div>`+
    (openMode?`<div class="addbar"><button class="btn sm" data-addcall>+ Add call</button><span class="small">New call is attributed to ${esc(analystName(selAnalyst))}. Set an exit date to move it to Historical Trades. Ticker = Yahoo symbol with exchange suffix (2330.TW · 0700.HK · RELIANCE.NS · 005930.KS · AAPL).</span></div>`:"");
}
function coverageTable(sum){
  const byTk={};
  sum.calls.forEach(x=>{const k=x.c.ticker;(byTk[k]||(byTk[k]={name:x.c.name,ticker:k,items:[]})).items.push(x);});
  const rows=Object.values(byTk).map(g=>{
    const latest=g.items.slice().sort((a,b)=>(b.c.entryDate||"").localeCompare(a.c.entryDate||""))[0];
    const scored=g.items.filter(x=>x.s.result==="HIT"||x.s.result==="MISS");
    const hits=scored.filter(x=>x.s.result==="HIT").length;
    return `<tr><td><span class="name link" data-chart="${esc(g.ticker)}" data-nm="${esc(g.name)}">${esc(g.name)}</span><span class="tk">${esc(g.ticker)}</span></td>
      <td><span class="pill ${(latest.c.call||"").toLowerCase()}">${esc(latest.c.call)}</span></td>
      <td class="num">${money(livePrice(g.ticker),ccyFromTicker(g.ticker))}</td>
      <td class="num">${g.items.length}</td>
      <td class="num">${pctSpan(latest.s.alpha)}</td>
      <td class="num">${scored.length?Math.round(100*hits/scored.length)+"%":"–"}</td></tr>`;
  }).join("");
  return `<div class="desc">Distinct names ${esc(analystName(selAnalyst))} covers — latest stance, price, calls made and hit rate.</div>
    <div class="tw"><table><thead><tr><th>Stock</th><th>Latest</th><th class="num">Price</th><th class="num">Calls</th><th class="num">Latest α</th><th class="num">Hit rate</th></tr></thead>
    <tbody>${rows||emptyRow(6,"No coverage yet.")}</tbody></table></div>`;
}

  const head=`<tr><th>Stock</th><th class="num">Cost</th><th class="num">LTP</th><th class="num">1D</th><th class="num">1W</th><th class="num">1M</th><th class="num">YTD</th><th class="num">Return</th><th></th></tr>`;
  const rowHtml=h=>{const ccy=h.currency||ccyFromTicker(h.ticker), px=livePrice(h.ticker), q=quote(h.ticker)||{}; const ret=(px!=null&&h.entry)?px/h.entry-1:null;
    return `<tr data-id="${h.id}" data-coll="holdings">
      ${stockCell(h)}
      <td><input class="cell w-sm" data-f="entry" type="number" value="${h.entry??""}"></td>
      <td class="num">${money(px,ccy)}</td>
      <td class="num">${pctSpanRaw(q.d1)}</td><td class="num">${pctSpanRaw(q.w1)}</td><td class="num">${pctSpanRaw(q.m1)}</td><td class="num">${pctSpanRaw(q.ytd)}</td>
      <td class="num">${ret==null?"–":pctSpan(ret)}</td>
      <td><span class="del" data-del>✕</span></td></tr>`;};
  let groups="";
  for(const [code,label] of present){
    const rows=H.filter(h=>(h.country||countryFromTicker(h.ticker))===code);
    groups+=`<tr class="grp-head"><td colspan="9">${label} <span class="cnt">· ${rows.length}</span></td></tr>`+rows.map(rowHtml).join("");
  }
  if(!H.length) groups=emptyRow(9,"No holdings yet — add one or upload a statement PDF.");
  return `<div class="panel"><h2>Holdings</h2><div class="desc">Grouped by country. Cost = your entry price. LTP, 1D/1W/1M/YTD from the price feed. Return = LTP ÷ cost − 1.</div>

    <div class="tw"><table><thead>${head}</thead><tbody>${groups}</tbody></table></div>
    <div class="addbar"><button class="btn sm" data-addhold>+ Add holding</button><button class="btn sm gold" id="btnPdf">⬆ Upload statement (PDF)</button><input type="file" id="pdfInput" accept="application/pdf" class="hidden"><span class="small">Ticker = Yahoo symbol with exchange suffix (2330.TW · 0700.HK · RELIANCE.NS · 005930.KS · AAPL). PDF is read in your browser; you review before anything is added.</span></div></div>`;
}

/* ---------- PDF upload → parse → review → fill Holdings ---------- */
const SAMPLE_STMT=`Portfolio Statement as of 29 Jul 2026
Stock                     Qty       Avg Cost
Reliance Industries       145265    1308.00
TSMC                      5000      1100.00
Tencent Holdings          8000      620.00
DBS Group Holdings        3000      38.50
Samsung Electronics       12000     71000.00`;
function parseHoldingsText(text){
  // PDF text arrives word-by-word (many spaces). Take the full name = everything before
  // the first number; cost = the first decimal number (prices carry decimals), else the
  // last integer. Rows are always reviewed before saving, so err toward capturing.
  const out=[];
  text.split(/\r?\n/).forEach(raw=>{
    const line=raw.replace(/\s+/g," ").trim();
    if(!line) return;
    if(/^(total|subtotal|grand total|net|cash|balance|opening|closing)\b/i.test(line)) return;
    if(/\b(qty|quantity|avg\s*cost|market\s*value|statement|portfolio|symbol|units?|as of|shares?)\b/i.test(line) && !/\d[\d,]*\.\d/.test(line)) return;
    const m=line.match(/^([A-Za-z][A-Za-z0-9 .&'\/\-]*?)\s+([\d(].*)$/);
    if(!m) return;
    const name=m[1].trim(), rest=m[2];
    const decs=rest.match(/\d[\d,]*\.\d+/g), ints=rest.match(/\d[\d,]+/g);
    if(name.length<2 || (!decs && !ints)) return;
    const cost=parseFloat((decs?decs[0]:ints[ints.length-1]).replace(/,/g,""));
    out.push({name, ticker:"", cost:isNaN(cost)?null:cost, country:""});
  });
  return out;
}
async function handlePdf(file){
  const key=localStorage.getItem(LS_CLAUDE);
  toast(`<span class="spin"></span> Reading ${esc(file.name)}…`);
  let text="";
  try{ text=await extractPdfText(await file.arrayBuffer()); }
  catch(e){ toast(""); alert("Could not read PDF: "+e.message); return; }
  let rows;
  if(key){ try{ rows=await extractWithClaude(text,key); }catch(e){ rows=parseHoldingsText(text); toast(""); } }
  else rows=parseHoldingsText(text);
  toast("");
  if(!rows||!rows.length){ alert("Couldn't find any holdings in that PDF — try adding rows manually."); return; }
  reviewHoldings(rows,file.name);
}
async function extractPdfText(buf){
  const pdfjs=window.pdfjsLib;
  if(!pdfjs) throw new Error("PDF library still loading — try again in a second");
  pdfjs.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  const doc=await pdfjs.getDocument({data:buf}).promise;
  let out="";
  for(let p=1;p<=doc.numPages;p++){
    const content=await (await doc.getPage(p)).getTextContent();
    let lastY=null,line="";
    for(const it of content.items){ const y=it.transform[5];
      if(lastY!==null&&Math.abs(y-lastY)>3){ out+=line.trimEnd()+"\n"; line=""; }
      line+=it.str+(it.hasEOL?"":"  "); lastY=y; }
    out+=line+"\n";
  }
  return out;
}
async function extractWithClaude(text,key){
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-5",max_tokens:2000,messages:[{role:"user",content:`Extract the holdings from this brokerage/portfolio statement. Return ONLY a JSON array of objects {"name","ticker","cost","country"} — name=company name; ticker=Yahoo symbol if inferable else ""; cost=average cost per share as a number; country one of HK,CN,IN,TW,KR,ASEAN,US,JP. No prose.\n\n${text.slice(0,12000)}`}]})});
  if(!res.ok) throw new Error("Anthropic "+res.status);
  const j=await res.json(); const raw=(j.content&&j.content[0]&&j.content[0].text)||"[]";
  return JSON.parse(raw.slice(raw.indexOf("["),raw.lastIndexOf("]")+1));
}
function reviewHoldings(rows,src){
  const root=document.getElementById("modalRoot");
  const opts=c=>COUNTRIES.map(([code,label])=>`<option value="${code}" ${c===code?"selected":""}>${label}</option>`).join("");
  const body=rows.map((r,i)=>`<tr data-i="${i}">
    <td><input class="cell w-name" data-rf="name" value="${esc(r.name||"")}"></td>
    <td><input class="cell w-tk" data-rf="ticker" value="${esc(r.ticker||"")}" placeholder="e.g. 2330.TW"></td>
    <td><select class="cell w-sm" data-rf="country">${opts(r.country||"")}</select></td>
    <td><input class="cell w-sm" data-rf="cost" type="number" value="${r.cost??""}"></td>
    <td><span class="del" data-rdel>✕</span></td></tr>`).join("");
  root.innerHTML=`<div class="modal"><div class="box"><span class="x" id="mx">×</span><h3>Review extracted holdings</h3>
    <div class="small">From ${esc(src)} · ${rows.length} row(s). Add a Yahoo ticker (with suffix) so prices resolve. Fix anything, then add.</div>
    <div class="note">This is a draft from the PDF — nothing is saved until you click Add.</div>
    <div class="tw"><table><thead><tr><th>Name</th><th>Ticker</th><th>Country</th><th class="num">Cost</th><th></th></tr></thead><tbody id="revBody">${body}</tbody></table></div>
    <div class="addbar"><button class="btn gold" id="revAdd">Add ${rows.length} holding(s)</button><button class="btn ghost" id="revCancel">Cancel</button></div></div></div>`;
  const state=rows.map(r=>({...r}));
  root.querySelector("#mx").onclick=root.querySelector("#revCancel").onclick=()=>root.innerHTML="";
  root.querySelectorAll("#revBody [data-rf]").forEach(inp=>inp.addEventListener("change",e=>{const i=+e.target.closest("tr").dataset.i,f=e.target.dataset.rf; state[i][f]=f==="cost"?(e.target.value===""?null:parseFloat(e.target.value)):e.target.value;}));
  root.querySelectorAll("#revBody [data-rdel]").forEach(d=>d.onclick=e=>{const i=+e.target.closest("tr").dataset.i; state[i]._x=true; e.target.closest("tr").remove();});
  root.querySelector("#revAdd").onclick=()=>{
    state.filter(r=>!r._x&&(r.name||r.ticker)).forEach(r=>{const tk=(r.ticker||"").trim(); BOOK.holdings.push({id:"h-"+Math.random().toString(36).slice(2,8),name:r.name||"",ticker:tk,country:r.country||countryFromTicker(tk),currency:ccyFromTicker(tk),entry:r.cost??null,entryDate:"",source:"pdf import",notes:""});});
    save(); root.innerHTML=""; view="holdings"; buildNav(); render();
  };
}
function toast(html){let t=document.getElementById("toast"); if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border-2);padding:9px 16px;border-radius:10px;z-index:80;font-size:13px";document.body.appendChild(t);} if(!html){t.remove();return;} t.innerHTML=html;}

function bookOut(){const o=structuredClone(BOOK); o.updated=new Date().toISOString().slice(0,10); return o;}

async function publish(){
  const tok=localStorage.getItem(LS_GH); if(!tok){alert("Add a GitHub token in Settings first."); openSettings(); return;}
  const path="data/book.json", api=`https://api.github.com/repos/${REPO}/contents/${path}`;
  toast(`<span class="spin"></span> Publishing…`);
  try{
    const cur=await fetch(api,{headers:{authorization:"Bearer "+tok,accept:"application/vnd.github+json"}});
    const sha=cur.ok?(await cur.json()).sha:undefined;
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(bookOut(),null,2))));
    const res=await fetch(api,{method:"PUT",headers:{authorization:"Bearer "+tok,accept:"application/vnd.github+json","content-type":"application/json"},body:JSON.stringify({message:"Update book.json via portal",content,sha})});
    toast("");
    if(res.ok) alert("Published ✓ — the site redeploys in ~1 minute.");
    else alert("Publish failed ("+res.status+"). Check the token scope.");
  }catch(e){ toast(""); alert("Publish error: "+e.message); }
}
